name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: featherlane_test
          POSTGRES_USER: featherlane
          POSTGRES_PASSWORD: featherlane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U featherlane -d featherlane_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://featherlane:featherlane@localhost:5432/featherlane_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure ephemeral auth build values
        run: |
          echo "BETTER_AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_ID=ci-build-only.apps.googleusercontent.com" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral Compose auth values
        run: |
          echo "BETTER_AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_ID=ci-build-only.apps.googleusercontent.com" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_USER=ci-minio-admin" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OBJECT_STORE_ACCESS_KEY_ID=ci-featherlane-service" >> "$GITHUB_ENV"
          echo "OBJECT_STORE_SECRET_ACCESS_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOVERNANCE_CONSOLE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SOURCE_CONNECTOR_ACTIVE_KEY_VERSION=1" >> "$GITHUB_ENV"
          echo "SOURCE_CONNECTOR_ENCRYPTION_KEY_V1=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose config --quiet

  ingestion-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral stack secrets
        run: |
          echo "BETTER_AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_ID=ci-build-only.apps.googleusercontent.com" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_USER=ci-minio-admin" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OBJECT_STORE_ACCESS_KEY_ID=ci-featherlane-service" >> "$GITHUB_ENV"
          echo "OBJECT_STORE_SECRET_ACCESS_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOVERNANCE_CONSOLE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SOURCE_CONNECTOR_ACTIVE_KEY_VERSION=1" >> "$GITHUB_ENV"
          echo "SOURCE_CONNECTOR_ENCRYPTION_KEY_V1=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose up --build -d postgres minio minio-init governance-api governance-worker telemetry-gateway refund-agent
      - run: |
          for attempt in $(seq 1 90); do curl --fail --silent http://localhost:8080/health >/dev/null && exit 0; sleep 2; done
          exit 1
      - run: ./scripts/smoke-ingestion-to-evaluation.sh
      - if: failure()
        run: docker compose logs --no-color governance-api governance-worker telemetry-gateway
      - if: always()
        run: docker compose down -v
