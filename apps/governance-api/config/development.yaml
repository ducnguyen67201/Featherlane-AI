logger:
  enable: true
  pretty_backtrace: true
  level: info
  format: json

server:
  port: {{ get_env(name="PORT", default="8080") }}
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    fallback:
      enable: false
    static:
      enable: false

workers:
  mode: BackgroundAsync

database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://featherlane:featherlane@localhost:5432/featherlane") }}
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
