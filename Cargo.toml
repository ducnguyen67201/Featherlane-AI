[workspace]
resolver = "2"
members = [
  "crates/governance-domain",
  "crates/governance-ingestion",
  "crates/governance-application",
  "crates/governance-persistence",
  "crates/governance-policy",
  "crates/governance-corpus",
  "crates/governance-targets",
  "crates/governance-telemetry",
  "crates/governance-evaluator",
  "crates/governance-reports",
  "crates/governance-config",
  "apps/governance-api",
  "apps/governance-worker",
  "apps/governance-telemetry-gateway",
  "apps/governance-sandbox",
  "apps/gov-eval",
  "examples/refund-agent",
  "migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
clap = { version = "4.5", features = ["derive", "env"] }
governance-application = { path = "crates/governance-application" }
governance-config = { path = "crates/governance-config" }
governance-corpus = { path = "crates/governance-corpus" }
governance-domain = { path = "crates/governance-domain" }
governance-evaluator = { path = "crates/governance-evaluator" }
governance-ingestion = { path = "crates/governance-ingestion" }
governance-persistence = { path = "crates/governance-persistence" }
governance-policy = { path = "crates/governance-policy" }
governance-reports = { path = "crates/governance-reports" }
governance-targets = { path = "crates/governance-targets" }
governance-telemetry = { path = "crates/governance-telemetry" }
hex = "0.4"
http = "1.3"
httpdate = "1.0"
futures-util = "0.3"
docx-rs = { version = "0.4.22", default-features = false }
base64 = "0.23.1"
flate2 = "1.1.9"
loco-rs = { version = "1.0.0", default-features = false, features = ["cli", "with-db", "worker"] }
opendal = { version = "0.58.1", default-features = false, features = ["executors-tokio", "reqwest-rustls-tls", "services-memory", "services-s3"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
pdf-extract = "0.12.0"
prost = "0.14.4"
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "1.0", features = ["uuid1"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-time", "with-uuid"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "macros"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5", "v7"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
