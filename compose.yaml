name: featherlane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: featherlane
      POSTGRES_USER: featherlane
      POSTGRES_PASSWORD: featherlane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featherlane -d featherlane"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  governance-api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        RUST_PACKAGE: governance-api
        RUST_BINARY: governance-api
    command: ["start", "--server-and-worker"]
    environment:
      DATABASE_URL: postgres://featherlane:featherlane@postgres:5432/featherlane
      LOCO_QUEUE_URL: postgres://featherlane:featherlane@postgres:5432/featherlane
      OBJECT_STORE_URL: http://minio:9000
      OBJECT_STORE_BUCKET: featherlane
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_ACCESS_KEY_ID: featherlane-dev
      OBJECT_STORE_SECRET_ACCESS_KEY: featherlane-dev-only
      POLICY_LLM_ENABLED: "true"
      POLICY_LLM_PROVIDER: heuristic
      POLICY_LLM_PROMPT_VERSION: policy-extract-v1
      PORT: "8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports: ["8080:8080"]

  telemetry-gateway:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        RUST_PACKAGE: governance-telemetry-gateway
        RUST_BINARY: governance-telemetry-gateway
    environment:
      GOVERNANCE_GATEWAY_ADDR: 0.0.0.0:4318
      DATABASE_URL: postgres://featherlane:featherlane@postgres:5432/featherlane
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["4318:4318"]

  governance-worker:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        RUST_PACKAGE: governance-worker
        RUST_BINARY: governance-worker
    environment:
      DATABASE_URL: postgres://featherlane:featherlane@postgres:5432/featherlane
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        RUST_PACKAGE: governance-sandbox
        RUST_BINARY: governance-sandbox
    environment:
      GOVERNANCE_SANDBOX_ADDR: 0.0.0.0:8090
    ports: ["8090:8090"]

  refund-agent:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        RUST_PACKAGE: refund-agent
        RUST_BINARY: refund-agent
    ports: ["8091:8091"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      secrets:
        - better_auth_secret
        - google_client_secret
    environment:
      GOVERNANCE_API_URL: http://governance-api:8080
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
    depends_on: [governance-api]
    ports: ["3000:3000"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: featherlane-dev
      MINIO_ROOT_PASSWORD: featherlane-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 featherlane-dev featherlane-dev-only; do sleep 1; done;
        mc mb --ignore-existing local/featherlane;
        mc anonymous set none local/featherlane
    depends_on: [minio]

volumes:
  postgres-data:
  minio-data:

secrets:
  better_auth_secret:
    environment: BETTER_AUTH_SECRET
  google_client_secret:
    environment: GOOGLE_CLIENT_SECRET
